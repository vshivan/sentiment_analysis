<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0099cc"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#006688"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#g1)" opacity="0.15"/>
  <circle cx="32" cy="32" r="28" stroke="url(#g1)" stroke-width="1.5" fill="none" opacity="0.3"/>
  <!-- Brain/pulse wave -->
  <path d="M10 32 L18 32 L22 18 L26 44 L30 24 L34 38 L38 20 L42 40 L46 28 L50 32 L54 32" 
        stroke="url(#g1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
  <!-- Nodes -->
  <circle cx="22" cy="18" r="2.5" fill="#00d4ff"/>
  <circle cx="30" cy="24" r="2.5" fill="#00d4ff"/>
  <circle cx="38" cy="20" r="2.5" fill="#00d4ff"/>
  <circle cx="26" cy="44" r="2" fill="#00e676" opacity="0.8"/>
  <circle cx="34" cy="38" r="2" fill="#ffca28" opacity="0.8"/>
  <circle cx="42" cy="40" r="2" fill="#ff5252" opacity="0.8"/>
  <!-- Central glow dot -->
  <circle cx="32" cy="32" r="3" fill="#00d4ff" opacity="0.6">
    <animate attributeName="r" values="3;4;3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
